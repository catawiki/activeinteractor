changelog:
  categories:
    - title: Breaking Changes 🛠
      labels:
        - version:major
    - title: New Features 🎉
      labels:
        - version:minor
        - enhancement
    - title: Bug fix 🐞
      labels:
        - version:patch
    - title: Dependencies Upgrades ⬆️
      labels:
        - dependencies
    - title: Changes 📦
      labels:
        - "*"
